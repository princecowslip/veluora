# cargo-deny configuration — Workstream 13's "dependency inventory" /
# "security scan" gates from docs/46-implementation-plan.md. Run via
# `cargo deny check` locally or in CI (.github/workflows/ci.yml).
#
# The license allow-list below was generated against this workspace's
# actual dependency tree (`cargo deny check licenses`), not guessed —
# see the commit this file was added in for the exact command output
# it was validated against.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# All three ignored advisories below are the same shape: an
# "unmaintained" (not a known-exploitable vulnerability) flag on a
# crate deep in `iced`'s font/rendering stack, with the advisory
# itself stating no safe upgrade exists. None are fixable by a version
# bump; replacing `iced` is far outside this hardening pass's scope.
# Documented here (and in KNOWN_ISSUES.md) as accepted, tracked risk
# rather than silently ignored — remove each once iced's dependency
# tree moves off the affected crate.
#   - RUSTSEC-2026-0192: ttf-parser (via cosmic-text/rustybuzz, and
#     separately via owned_ttf_parser/ab_glyph/sctk-adwaita/winit)
#   - RUSTSEC-2024-0436: paste (via metal/wgpu-hal/wgpu, and separately
#     via pulp/exr/image)
#   - RUSTSEC-2026-0206: rustybuzz (via cosmic-text)
#   - RUSTSEC-2024-0384: instant (via parking_lot 0.11/wasm-timer/iced_futures)
ignore = [
  "RUSTSEC-2026-0192",
  "RUSTSEC-2024-0436",
  "RUSTSEC-2026-0206",
  "RUSTSEC-2024-0384",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "CC0-1.0",
]

# This workspace's own crates (domain, database, application, media,
# local-api, connectors, plugin-host, cli, gui) are all `publish =
# false` and have no `license` field — there's nothing to check here
# since none of them are published, and picking a license is a
# decision for the project owner, not something to invent unilaterally.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Denies a *third-party* crate depending on something with no version
# requirement at all (a real supply-chain risk). This workspace's own
# crates reference each other via path deps with no `version =`
# field, which cargo-deny also counts as "wildcard" by default —
# `allow-wildcard-paths` exempts exactly that safe, intentional case.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
